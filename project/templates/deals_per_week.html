<body>

<h3 align="center">
    CHANGING DEALS LIMIT
</h3>
<div id="main-wrapper" data-navbarbg="skin6" data-theme="light" data-layout="vertical" data-sidebartype="full" data-boxed-layout="full">
    <div class="page-breadcrumb">
    </div>
    <div class="container-fluid">

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="control-label">Enter new value for the number of deals to be shown per week for Investor</label>
                <br>
                <input type="number" min="3" max="10" name="inv_deals">
                <br>
                <button type="submit" class="btn btn-primary" data-confirm="Are you sure to delete this item?">Submit</button>
            </div>
        </form>


        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="control-label">Enter new value for the number of deals to be shown per week for startup</label>
                <br>
                <input type="number" min="3" max="10" name="str_deals">
                <br>
                <button type="submit" class="btn btn-primary" data-confirm="Are you sure to delete this item?">Submit</button>
            </div>
        </form>
    </div>

</div>
</body>
